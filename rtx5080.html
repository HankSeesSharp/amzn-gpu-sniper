<script>
async function checkForChanges(url) {
    // Get the current time as the 'If-Modified-Since' reference
    let lastChecked = localStorage.getItem("lastModified") || new Date(0).toUTCString();

    try {
        let response = await fetch(url, {
            method: "GET",
            headers: {
                "If-Modified-Since": lastChecked // Ask server if newer version exists
            },
            cache: "no-cache"
        });

        if (response.status === 304) {
            console.log("No changes detected (304 Not Modified)");
        } else if (response.ok) {
            console.log("Page updated, fetching new version.");
            let newLastModified = response.headers.get("Last-Modified");
            if (newLastModified) {
                localStorage.setItem("lastModified", newLastModified);
            }
            location.reload();
        }
    } catch (error) {
        console.error("Error checking for updates:", error);
    }
}

// Run check every 30 seconds
setInterval(() => checkForChanges(window.location.href), 5000);
    </script>
